services:
  - type: web
    name: veloura-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_URL
        value: https://velouraskincare.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
